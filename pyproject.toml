[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-bio"
version = "0.1.0"
description = "TRUST-BIO: TRansportability Under Site/device sensor Taxonomy for BIOsignal foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn==1.7.2",
    "wfdb>=4.1",
]

[project.optional-dependencies]
signals = ["neurokit2", "pyPPG"]
fms = ["torch", "momentfm", "chronos-forecasting", "umap-learn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["trustbio*"]

[project.scripts]
trustbio-fetch = "scripts.fetch_datasets:main"
trustbio-cohort = "scripts.build_cohorts:main"
trustbio-degrade = "scripts.inject_degradation:main"
trustbio-extract = "scripts.extract_features:main"
trustbio-transport = "scripts.run_transport_eval:main"
trustbio-taxonomy = "scripts.run_taxonomy:main"
trustbio-benchmark = "scripts.run_benchmark:main"
